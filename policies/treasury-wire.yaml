# =============================================================================
# Treasury wire authorization.
# =============================================================================
#
# THE canonical treasury policy. One file, not two.
#
# It is simultaneously the reference tenant's policy -- loaded by the seed, run
# by `make demo`, and exercised by the test suite -- and the file a design
# partner copies and edits. Those used to be separate files, and separate files
# drift: two examples of "the treasury ladder" that disagree undermine the thing
# the product is selling, which is that policy-as-code becomes part of your
# system of record.
#
# Every value you are expected to change is marked CHANGE ME. Every rule
# explains why it exists, so you can edit it without guessing at the intent.
#
# Scrutexity is not the author of any customer's policy (Section 33). These
# thresholds are a defensible starting point, not regulatory advice. The
# platform executes the semantics you define; deciding what they should be is
# your treasury team's job and your auditor's concern.
#
# Behaviour is pinned by packages/core/test/policy-pack.test.ts -- move a
# threshold and a named test tells you which boundary you changed.
#
# -----------------------------------------------------------------------------
# Evaluation semantics you must understand before editing
# -----------------------------------------------------------------------------
#   * EVERY rule is evaluated. There is no first-match-wins.
#   * The strictest matched decision wins:  DENY > ESCALATE > ALLOW.
#   * Approval requirements from all matched escalations merge in the
#     MORE-DEMANDING direction: max quorum, union of roles, shortest window.
#     This is why the $1M rule does not repeat the $50k rule -- both match, and
#     the stricter one governs.
#   * A rule that matches nothing contributes nothing. If NO rule matches,
#     `defaults.decision` applies, and that is DENY.
#   * `priority` orders reporting and reason-code selection. It never
#     short-circuits evaluation.
#
# -----------------------------------------------------------------------------
# The tunables, in one place
# -----------------------------------------------------------------------------
# There is deliberately no `parameters:` block. Substituting values into a
# policy document would be a templating layer in the policy language, and the
# document that gets hashed onto every decision must be the document that was
# reviewed -- not a template that rendered into it. So the tunables are listed
# here for orientation and changed in place, where the diff a reviewer reads is
# the change itself.
#
#   autonomous_limit        $50,000     rule wire_fifty_thousand_and_above
#   leased_floor            $10,000     rule wire_ten_to_fifty_thousand
#   dual_approval_limit     $1,000,000  rule wire_one_million_and_above
#   approval_role           treasurer   every escalation
#   second_approval_role    cfo         rule wire_one_million_and_above
#   fraud_risk_threshold    0.9         rule elevated_fraud_risk
#   decay_duration          600s        rule elevated_fraud_risk
#   issuance_ceiling        $500,000    issuance.ceilings[treasury_admin]
#   accounts, counterparties, sanctioned destinations -- marked inline
# =============================================================================
apiVersion: scrutexity.dev/policy/v1
id: treasury_wire
version: 1.5.0

metadata:
  title: Treasury wire authorization
  description: >-
    Governs which outbound payment actions the treasury agents may take
    autonomously, which require a named human, and which are refused outright.
  # CHANGE ME -- your treasury operations team.
  owner: Acme Corporation Treasury Operations
  tags: [treasury, payments, wire]

defaults:
  # Nothing is permitted that a rule did not permit.
  decision: DENY
  reason_code: NO_RULE_MATCHED
  # An ALLOW is an execution grant, and it is short-lived: the agent must come
  # back if it did not act promptly, because the risk picture may have moved.
  execution_grant_ttl_seconds: 300

# -----------------------------------------------------------------------------
# Failure modes -- fail-closed for anything financial
# -----------------------------------------------------------------------------
#
# WHY ALL THREE: the alternative is that a control-plane outage becomes an
# authorization. If the policy cannot be read, the risk signals cannot be read,
# or the enforcement plane is down, the honest answer is "I cannot establish
# that this is authorised" -- and for money that means no.
#
# Size the cost honestly: a Postgres failover means payments queue rather than
# proceed. That is the correct trade for outbound money. If you have read-only
# actions that must survive an outage, put them in a SEPARATE policy -- do not
# weaken this one.
#
# `signal_unavailable` is the one people push back on, because signals are an
# input to risk rather than to authority. Keep it closed anyway: without signals
# you cannot tell a normal payment from one during an incident, and the whole
# point of decay is that the risk picture is load-bearing.
failure_modes:
  policy_unavailable: FAIL_CLOSED
  signal_unavailable: FAIL_CLOSED
  enforcement_unavailable: FAIL_CLOSED

# =============================================================================
# Issuable authority -- the top of the theorem.
# =============================================================================
#
# Containment guarantees a delegated grant never exceeds its parent. But a root
# lease is issued from nothing and has no parent, so without a ceiling here the
# whole chain hangs beneath an unbounded root: anyone holding the leases:write
# scope could mint any authority at all.
#
# A scope protects an endpoint. This governs what may come out of it. They are
# deliberately different things -- collapsing them is how a treasury system
# ends up with one boolean between an intern and a $10m wire.
#
# A role not named here may issue nothing. That is the correct direction: a
# policy that forgot to say fails closed.
issuance:
  enforced: true
  ceilings:
    # CHANGE ME: your provisioning role, your accounts, your counterparties.
    #
    # Note this ceiling ($500k) is well above what the rules below let an agent
    # do alone ($50k). That is intentional -- this bounds what may be HELD, the
    # rules bound what may be DONE with it.
    - role: treasury_admin
      grant:
        actions:
          - wire.create
          - wire.submit
          - wire.execute
          - wire.read
          - counterparty.read
          - account.read
        resources:
          bank_account: [acct_001, acct_002]
          counterparty: [cp_100, cp_101]
        constraints:
          max_amount: { currency: USD, amount: '500000.00' }
          currencies: [USD]
          allowed_counterparties: [cp_100, cp_101]

    # A treasurer approves; they do not provision. Read-only authority is the
    # most they may hand to a machine, so a compromised treasurer credential
    # cannot mint a paying agent. The $0.00 ceiling is the control, not a
    # placeholder.
    - role: treasurer
      grant:
        actions:
          - wire.read
          - counterparty.read
          - account.read
        resources:
          bank_account: [acct_001, acct_002]
          counterparty: [cp_100, cp_101]
        constraints:
          max_amount: { currency: USD, amount: '0.00' }
          currencies: [USD]
          allowed_counterparties: [cp_100, cp_101]

delegation:
  enabled: true
  max_depth: 2
  max_ttl_seconds: 3600
  # Money-moving authority is never delegable, however narrowly it is asked
  # for. This is the rule that makes Scene 6 of the demo a denial rather than
  # an argument about scope.
  non_delegable_actions:
    - wire.create
    - wire.modify
    - wire.submit
    - wire.execute

rules:
  # ---------------------------------------------------------------------------
  # Read-only work is unremarkable.
  # ---------------------------------------------------------------------------
  - id: read_only_operations
    description: Verification and reconciliation reads carry no financial consequence.
    priority: 10
    when:
      action:
        in: [counterparty.read, account.read, wire.read, statement.read]
    then:
      decision: ALLOW
      reason_code: READ_ONLY_ACTION

  # ===========================================================================
  # The amount ladder
  # ===========================================================================
  #
  # Four tiers, each a separate rule so you can move one threshold without
  # touching the others, and so a decision names exactly which tier it hit.
  #
  # CHANGE ME: every threshold below. Take them from your existing approval
  # matrix -- if your team already knows that $50k needs the treasurer, encode
  # that rather than inventing a new number here.
  # ---------------------------------------------------------------------------
  - id: wire_under_ten_thousand
    description: Routine low-value payments run unattended.
    priority: 20
    when:
      action: { prefix: 'wire.' }
      context.amount:
        lt: { amount: '10000', currency: USD }
    then:
      decision: ALLOW
      reason_code: BELOW_AUTONOMOUS_THRESHOLD

  # WHY A SEPARATE TIER when the decision is the same as tier 1: the reason code
  # is not, and that difference is what an auditor reads.
  # BELOW_AUTONOMOUS_THRESHOLD says policy waved it through on size.
  # WITHIN_LEASED_AUTHORITY says policy did not -- the agent's own ceiling and
  # counterparty list are what admitted it. Tighten a lease and these are the
  # payments that stop.
  - id: wire_ten_to_fifty_thousand
    description: >-
      Mid-value payments run unattended but only inside a scoped authority
      lease, so the agent's ceiling and counterparty list still bind.
    priority: 25
    when:
      action: { prefix: 'wire.' }
      context.amount:
        gte: { amount: '10000', currency: USD }
        lt: { amount: '50000', currency: USD }
    then:
      decision: ALLOW
      reason_code: WITHIN_LEASED_AUTHORITY

  # WHY forbid_self_approval: the confused-deputy case. Without it, an agent
  # acting under a treasurer's delegated authority could satisfy its own
  # escalation. The approver must be a different principal from the requester.
  #
  # WHY ttl_seconds: an approval is not permanent. If the treasurer approves and
  # nobody acts for an hour, conditions may have changed -- and if they have, the
  # execution boundary refuses with APPROVAL_CONTEXT_MISMATCH rather than
  # proceeding on a stale yes.
  - id: wire_fifty_thousand_and_above
    description: Six-figure payments require the treasurer.
    priority: 30
    when:
      action: { prefix: 'wire.' }
      context.amount:
        gte: { amount: '50000', currency: USD }
    then:
      decision: ESCALATE
      reason_code: TREASURER_APPROVAL_REQUIRED
      approval:
        quorum: 1
        roles: [treasurer]
        forbid_self_approval: true
        ttl_seconds: 3600

  # WHY THIS RULE DOES NOT REPEAT TIER 3: both rules match a $2m wire, and
  # approval requirements merge in the more-demanding direction -- max quorum,
  # union of roles. So a $2m payment needs quorum 2 across {treasurer, cfo}
  # without this rule restating anything. Repeating tier 3 here would drift.
  - id: wire_one_million_and_above
    description: Seven-figure payments require the treasurer and the CFO.
    priority: 40
    when:
      action: { prefix: 'wire.' }
      context.amount:
        gte: { amount: '1000000', currency: USD }
    then:
      decision: ESCALATE
      reason_code: TREASURER_AND_CFO_APPROVAL_REQUIRED
      approval:
        quorum: 2
        roles: [treasurer, cfo]
        forbid_self_approval: true
        ttl_seconds: 7200

  # ---------------------------------------------------------------------------
  # Counterparty controls.
  #
  # `context.counterparty_known` is derived by the control plane from the
  # tenant's own counterparty register. It is never read from the caller: an
  # agent that could assert its counterparty is known would have defeated the
  # control by asserting it.
  # ---------------------------------------------------------------------------
  # WHY DENY RATHER THAN ESCALATE: a new counterparty is the single highest
  # signal of a compromised or confused agent, and it is also the one case a
  # tired approver waves through at 6pm. Onboarding a counterparty should be a
  # deliberate act in your vendor system, not a decision made in an approval
  # queue at the moment money is trying to move.
  #
  # If you genuinely need a break-glass path, add a SEPARATE narrowly-scoped
  # rule with its own reason code and a quorum-2 approval. Keep this one strict
  # and visible in the diff.
  - id: unknown_counterparty
    description: Money never moves to a counterparty the organization has not registered.
    priority: 50
    when:
      action: { prefix: 'wire.' }
      context.counterparty_known: { eq: false }
    then:
      decision: DENY
      reason_code: UNKNOWN_COUNTERPARTY

  # CHANGE ME: your sanctions list, from your compliance team's source of truth.
  # This is a coarse country backstop, not a sanctions screening product -- keep
  # real screening upstream.
  - id: sanctioned_destination
    description: Destinations under comprehensive sanctions are refused outright.
    priority: 55
    when:
      action: { prefix: 'wire.' }
      context.destination_country:
        in: [KP, IR, SY, CU]
    then:
      decision: DENY
      reason_code: SANCTIONED_DESTINATION

  # ---------------------------------------------------------------------------
  # Signal-driven authority decay.
  #
  # The removal below narrows what the agent may do *unsupervised*; it does not
  # redefine the agent's role. A wire that was inside its remit stays inside
  # its remit -- it just stops being something the agent does alone.
  #
  # WHY AN EFFECT AND AN APPROVAL TOGETHER: the effect narrows what the agent
  # may do alone; the approval names who can supply the difference. Without the
  # effect a high-risk agent keeps full autonomy; without the approval a
  # legitimate payment during an elevated-risk window has no route forward.
  #
  # WHAT THIS CANNOT DO, BY CONSTRUCTION: it cannot widen anything. A signal
  # only subtracts -- Law 2, checked at runtime and asserted over randomised
  # signal sets. A source you trust completely, holding a valid key, cannot turn
  # a DENY into an ALLOW or raise a ceiling. Nor can it make an otherwise-refused
  # request approvable: only decay, where the base grant covered the attempt, may
  # be rescued by an approver this rule names. See G-19 in
  # docs/security-surface-map.md.
  #
  # CHANGE ME: the threshold and the duration. 0.9 assumes your engine emits
  # calibrated 0-1 scores. If it emits something else, calibrate here -- the
  # policy is the reviewed artifact, not the engine.
  # ---------------------------------------------------------------------------
  - id: elevated_fraud_risk
    description: A live fraud signal above 0.9 suspends unattended payment authority.
    priority: 60
    when:
      action: { prefix: 'wire.' }
      signal.fraud_risk.agent:
        gte: 0.9
    then:
      decision: ESCALATE
      reason_code: FRAUD_RISK_HUMAN_REVIEW
      approval:
        quorum: 1
        roles: [treasurer]
        forbid_self_approval: true
        ttl_seconds: 1800
      authority_effect:
        remove_actions: [wire.create, wire.submit, wire.execute, wire.modify]
        duration_seconds: 600

  # WHY NO authority_effect HERE: the risk is attached to the counterparty, not
  # to the agent, so narrowing the agent's authority would punish the wrong
  # principal.
  - id: elevated_counterparty_risk
    description: A risky counterparty pulls a human into the loop regardless of amount.
    priority: 60
    when:
      action: { prefix: 'wire.' }
      signal.counterparty_risk.counterparty:
        gte: 0.8
    then:
      decision: ESCALATE
      reason_code: COUNTERPARTY_RISK_HUMAN_REVIEW
      approval:
        quorum: 1
        roles: [treasurer]
        forbid_self_approval: true
        ttl_seconds: 1800

  # WHY AN AGENT'S SELF-REPORT IS ADMISSIBLE: it can only ever make the outcome
  # stricter. There is no rule reading this signal in the widening direction,
  # and the containment law would refuse one.
  - id: low_model_confidence
    description: >-
      An agent that reports low confidence in its own reasoning does not get to
      move money on it. The signal is advisory input, not an excuse to widen.
    priority: 65
    when:
      action: { prefix: 'wire.' }
      signal.model_confidence.agent:
        lt: 0.6
    then:
      decision: ESCALATE
      reason_code: LOW_MODEL_CONFIDENCE
      approval:
        quorum: 1
        roles: [treasurer]
        forbid_self_approval: true
        ttl_seconds: 1800
