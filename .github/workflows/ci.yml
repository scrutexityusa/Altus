name: CI

on:
  # Every branch, not just main. A branch whose pull request has been merged or
  # closed stops firing `pull_request`, so work pushed to it afterwards was
  # verified nowhere at all -- which is ADR-0020's failure one scope smaller,
  # and it silently disarms `make ci-status`.
  #
  # PR'd branches therefore run twice, once per trigger. That is the price of
  # covering both the branch head and the merge result, and the concurrency
  # group below cancels superseded runs within each.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_ADMIN_URL: postgres://scrutexity_owner:scrutexity@127.0.0.1:5432/scrutexity
  DATABASE_URL: postgres://scrutexity_app:scrutexity@127.0.0.1:5432/scrutexity

jobs:
  # The pure domain has no dependencies at all, so it runs first and fails
  # fast. If the authority lattice is broken, nothing else is worth running.
  core:
    name: Core (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (sources and tests)
        # tsconfig.build.json excludes test files, so they get their own pass.
        # Without it a test can drift from the types it exercises and still
        # run, because the runner strips types rather than checking them.
        run: pnpm run typecheck
      - name: Formatting
        run: pnpm exec prettier --check .
      - name: Published contracts match the code
        run: pnpm exec tsx scripts/generate-specs.ts --check
      - name: Canonicalization vectors match the implementation
        # Drift here changes the bytes of every hash the system has issued.
        run: pnpm exec tsx scripts/generate-canonicalization-vectors.ts --check
      - name: Unit and invariant tests
        # vitest.unit.config.ts deliberately has no globalSetup. The single
        # shared configuration provisioned a database unconditionally, so this
        # step failed on connect in a job that has no PostgreSQL service -- and
        # because every other job `needs: core`, nothing downstream ever ran.
        run: pnpm exec vitest run --config vitest.unit.config.ts

  integration:
    name: Integration, security and demo
    runs-on: ubuntu-latest
    needs: core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scrutexity_owner
          POSTGRES_PASSWORD: scrutexity
          POSTGRES_DB: scrutexity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scrutexity_owner"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create the non-owner application role
        run: |
          PGPASSWORD=scrutexity psql -h 127.0.0.1 -U scrutexity_owner -d scrutexity \
            -v ON_ERROR_STOP=1 -f db/init/00-roles.sql

      # The suite provisions and drops its own database per run (see
      # test/global-setup.ts), so this only proves the cluster is reachable and
      # the migrations apply.
      - name: Migrate
        run: pnpm exec tsx scripts/migrate.ts

      - name: Migrations roll back and reapply
        # A migration without a working down migration is a one-way door.
        # Proving the round trip here means nobody discovers that during an
        # incident.
        # The depth is derived, not pinned: `--down 3` reached 0010 when 0012
        # was the head, and adding a migration moved the window off it without
        # failing anything.
        run: |
          HEAD_MIGRATION=$(ls db/migrations/[0-9][0-9][0-9][0-9]_*.sql \
            | grep -v '\.down\.sql$' | sed 's|.*/||' | cut -c1-4 | sort -n | tail -1)
          DEPTH=$((10#$HEAD_MIGRATION - 10 + 1))
          echo "rolling back $DEPTH migrations to undo 0010"
          pnpm exec tsx scripts/migrate.ts --down "$DEPTH"
          pnpm exec tsx scripts/migrate.ts

      # No build step here on purpose: vitest aliases the workspace packages to
      # their TypeScript source, so the suite is hermetic and can never pass
      # against a stale dist.
      - name: Integration, security and contract tests
        run: pnpm exec vitest run services spec

      # The demo scripts import @scrutexity/core through its package entry
      # point, exactly as the container image does, so they need the compiled
      # output that the tests deliberately bypass.
      - name: Build the workspace packages
        run: pnpm exec tsc -b tsconfig.build.json

      # The demo is a test. It runs from a clean database and asserts every
      # scene, so "the demo still works" is a build result, not a claim.
      - name: Treasury demo, from a clean database
        run: NO_COLOR=1 pnpm exec tsx scripts/demo.ts

      # The three suites below were in `make ci` and not here, so the local
      # gate was stronger than the remote one -- and these are the security
      # suites, which is the worst place for that gap. They invoke the Make
      # targets rather than restating the commands, so the two definitions
      # cannot drift again.
      #
      # `build` has already run above, so each is just the script.
      - name: Adversarial conformance suite
        run: NO_COLOR=1 make adversarial

      - name: Recovery under SIGKILL
        run: NO_COLOR=1 make recovery

      # Runs the onboarding guide's own shell -- curl, jq, a real server on a
      # real port. The in-process test harness cannot see a defect that lives
      # in the commands a partner copies, and one did.
      - name: Onboarding guide, run as written
        run: make onboarding

  build:
    name: Container image
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the control plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
