# Agent-delivered key custody, the posture production requires.
#
# `SECRET_PROVIDER=agent` reads the signing key from a memory-backed volume that
# a secrets agent writes. The key never enters the image, never enters the
# environment, is rotated by the manager, and vanishes with the pod. Altus holds
# no cloud credential and links no cloud SDK: the pod authenticates as itself
# (IRSA here) and the driver does the fetching.
#
# This example is AWS Secrets Manager via the Secrets Store CSI driver. GCP,
# Azure and Vault differ only in this object; External Secrets Operator and
# Vault Agent Injector reach the same tmpfs by a different route and need no
# change on the Altus side.
#
# See docs/key-management.md, including the two checks that stop this from being
# `SECRET_DIR` on a disk with a nicer name.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: altus-receipt-signing-key
  namespace: scrutexity
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "altus/receipt-signing-key"
        objectType: "secretsmanager"
        # The file Altus reads. RECEIPT_SIGNING_KEY_NAME must match.
        objectAlias: "receipt-signing-key"
---
# The patch to apply to deployment.yaml. `readOnly: true` on both sides, and
# defaultMode is the driver's business -- Altus refuses anything readable beyond
# its owner, so a mis-projected 0444 fails at boot rather than at an audit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrutexity-api
  namespace: scrutexity
spec:
  template:
    spec:
      serviceAccountName: scrutexity-api # annotated with the IRSA role ARN
      volumes:
        - name: signing-key
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: altus-receipt-signing-key
      containers:
        - name: api
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/altus/secrets
              readOnly: true
          env:
            - name: SECRET_PROVIDER
              value: agent
            - name: SECRET_DIR
              value: /var/run/altus/secrets
            - name: RECEIPT_SIGNING_KEY_NAME
              value: receipt-signing-key
            # Change this when you rotate. Old receipts keep verifying under
            # the old id -- see the rotation section in docs/key-management.md.
            - name: RECEIPT_SIGNING_KEY_ID
              value: receipt-2026-01
