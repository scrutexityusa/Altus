# TEMPLATE ONLY. Do not commit a filled-in copy of this file.
#
# In a real cluster this Secret is produced by External Secrets, Vault Agent,
# or the cloud provider's secret CSI driver. It is shown here so the required
# keys are unambiguous.
apiVersion: v1
kind: Secret
metadata:
  name: scrutexity-secrets
  namespace: scrutexity
type: Opaque
stringData:
  # The application connects as a NON-OWNER role. This is not cosmetic: the
  # table owner bypasses row level security, and tenant isolation depends on
  # this role not being it (ADR-0005).
  DATABASE_URL: 'postgres://scrutexity_app:REPLACE_ME@postgres.scrutexity.svc.cluster.local:5432/scrutexity'

  # NOTE: RECEIPT_SIGNING_KEY_B64 is deliberately absent, and setting it here
  # would make the service refuse to start.
  #
  # An Ed25519 private key in an environment variable is visible to anything
  # that can read /proc, is captured by most crash reporters, and is inherited
  # by every child process. Production reads the signing key from the key
  # manager named by SECRET_PROVIDER=kms, under RECEIPT_SIGNING_KEY_NAME, and
  # boot fails if the key manager has nothing to give -- there is no ephemeral
  # fallback in production. See ADR-0018.
