# TEMPLATE ONLY. Do not commit a filled-in copy of this file.
#
# In a real cluster this Secret is produced by External Secrets, Vault Agent,
# or the cloud provider's secret CSI driver. It is shown here so the required
# keys are unambiguous.
apiVersion: v1
kind: Secret
metadata:
  name: scrutexity-secrets
  namespace: scrutexity
type: Opaque
stringData:
  # The application connects as a NON-OWNER role. This is not cosmetic: the
  # table owner bypasses row level security, and tenant isolation depends on
  # this role not being it (ADR-0005).
  DATABASE_URL: 'postgres://scrutexity_app:REPLACE_ME@postgres.scrutexity.svc.cluster.local:5432/scrutexity'

  # Ed25519 private key, PKCS#8 PEM, base64-encoded. The service refuses to
  # start in production without it: unsigned evidence is evidence of nothing.
  #   openssl genpkey -algorithm ed25519 | base64 -w0
  RECEIPT_SIGNING_KEY_B64: 'REPLACE_ME'
